name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Linux system and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 rpm zip unzip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Qt resources
        run: pyside6-rcc resources/resources.qrc -o resources/resources_rc.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm StockWidget.spec

      - name: Read application version
        id: version
        run: |
          version="$(python -c 'from stockwidget.constants import APP_VERSION; print(APP_VERSION)')"
          if [[ -z "$version" ]]; then
            echo "APP_VERSION is empty" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package .deb
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          bash .github/scripts/package-deb.sh

      - name: Package .rpm
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash .github/scripts/package-rpm.sh

      - name: Create PyInstaller release zip
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          staging="$RUNNER_TEMP/StockWidget-Linux-$RELEASE_VERSION"
          mkdir "$staging"
          cp -a dist/StockWidget/. "$staging/"
          cp README.md LICENSE NOTICE "$staging/"
          test -x "$staging/StockWidget"

          archive="$GITHUB_WORKSPACE/StockWidget-Linux-$RELEASE_VERSION.zip"
          cd "$staging"
          # Preserve the shared-library symlinks used by PyInstaller.
          zip -q -r -y "$archive" .
          unzip -tq "$archive"

      - name: Upload PyInstaller zip
        uses: actions/upload-artifact@v7
        with:
          path: StockWidget-Linux-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          path: StockWidget-linux_*.deb
          if-no-files-found: error
          archive: false

      - name: Upload RPM package
        uses: actions/upload-artifact@v7
        with:
          path: StockWidget-linux_*.rpm
          if-no-files-found: error
          archive: false
