name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Linux system dependencies (Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm StockWidget.spec

      - name: Create zip (portable)
        run: |
          cd dist && zip -r ../StockWidget-linux.zip StockWidget

      - name: Package .deb
        run: |
          bash .github/scripts/package-deb.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: StockWidget-Linux
          path: |
            StockWidget-linux.zip
            StockWidget-linux_*.deb
