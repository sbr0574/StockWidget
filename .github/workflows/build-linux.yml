name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            python_arch: x64
            arch: amd64
          - runner: ubuntu-24.04-arm
            python_arch: arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}

      - name: Install Linux system and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb1 libxcb-cursor0 libxcb-shape0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libx11-6 libxext6 libxtst6 rpm zip unzip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Qt resources
        run: pyside6-rcc resources/resources.qrc -o resources/resources_rc.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm StockWidget.spec

      - name: Verify native build
        run: python .github/scripts/verify-build.py --arch ${{ matrix.arch }}

      - name: Read application version
        id: version
        run: |
          version="$(python -c 'from stockwidget.constants import APP_VERSION; print(APP_VERSION)')"
          if [[ -z "$version" ]]; then
            echo "APP_VERSION is empty" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package .deb
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          bash .github/scripts/package-deb.sh

      - name: Package .rpm
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash .github/scripts/package-rpm.sh

      - name: Create PyInstaller release zip
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          staging="$RUNNER_TEMP/StockWidget-Linux-$PACKAGE_ARCH"
          mkdir "$staging"
          cp -a dist/StockWidget/. "$staging/"
          cp README.md LICENSE NOTICE "$staging/"
          test -x "$staging/StockWidget"

          archive="$GITHUB_WORKSPACE/StockWidget-Linux-$PACKAGE_ARCH.zip"
          cd "$staging"
          # Preserve the shared-library symlinks used by PyInstaller.
          zip -q -r -y "$archive" .
          unzip -tq "$archive"

      - name: Upload PyInstaller zip
        uses: actions/upload-artifact@v7
        with:
          name: StockWidget-Linux-${{ matrix.arch }}.zip
          path: StockWidget-Linux-${{ matrix.arch }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: StockWidget-Linux-${{ matrix.arch }}.deb
          path: StockWidget-Linux-${{ matrix.arch }}.deb
          if-no-files-found: error
          archive: false

      - name: Upload RPM package
        uses: actions/upload-artifact@v7
        with:
          name: StockWidget-Linux-${{ matrix.arch }}.rpm
          path: StockWidget-Linux-${{ matrix.arch }}.rpm
          if-no-files-found: error
          archive: false
