name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Linux system dependencies (Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm StockWidget.spec

      - name: Read application version
        id: version
        run: |
          version="$(python -c 'from stockwidget.constants import APP_VERSION; print(APP_VERSION)')"
          if [[ -z "$version" ]]; then
            echo "APP_VERSION is empty" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package .deb
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          bash .github/scripts/package-deb.sh

      - name: Create release zip
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          shopt -s nullglob
          deb_files=(StockWidget-linux_*.deb)
          if (( ${#deb_files[@]} != 1 )); then
            echo "Expected exactly one .deb package, found ${#deb_files[@]}" >&2
            exit 1
          fi

          staging="$RUNNER_TEMP/StockWidget-Linux-$RELEASE_VERSION"
          mkdir "$staging"
          cp README.md LICENSE NOTICE "${deb_files[0]}" "$staging/"

          deb_name="$(basename "${deb_files[0]}")"
          archive="$GITHUB_WORKSPACE/StockWidget-Linux-$RELEASE_VERSION.zip"
          cd "$staging"
          zip -q "$archive" README.md LICENSE NOTICE "$deb_name"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: StockWidget-Linux-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          archive: false
