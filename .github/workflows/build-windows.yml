name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe
        run: |
          pyinstaller --clean --noconfirm StockWidget.spec

      - name: Create zip
        run: |
          Compress-Archive -Path dist\StockWidget -DestinationPath StockWidget-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: StockWidget-Windows
          path: StockWidget-windows.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: StockWidget-windows.zip
