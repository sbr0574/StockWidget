name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            python_arch: x64
            arch: amd64
          - runner: windows-11-arm
            python_arch: arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Qt resources
        run: pyside6-rcc resources/resources.qrc -o resources/resources_rc.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm StockWidget.spec

      - name: Verify native build
        run: python .github/scripts/verify-build.py --arch ${{ matrix.arch }}

      - name: Create release zip
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "StockWidget-Windows-$env:PACKAGE_ARCH"
          New-Item -ItemType Directory -Path $staging | Out-Null

          Copy-Item README.md, LICENSE, NOTICE -Destination $staging
          Copy-Item dist\StockWidget\StockWidget.exe -Destination $staging
          Copy-Item dist\StockWidget\_internal -Destination (Join-Path $staging "_internal") -Recurse

          $expected = @("_internal", "LICENSE", "NOTICE", "README.md", "StockWidget.exe") | Sort-Object
          $actual = Get-ChildItem -LiteralPath $staging | ForEach-Object Name | Sort-Object
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw "Unexpected files in release staging directory: $($actual -join ', ')"
          }

          $archive = "StockWidget-Windows-$env:PACKAGE_ARCH.zip"
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: StockWidget-Windows-${{ matrix.arch }}.zip
          path: StockWidget-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          archive: false
