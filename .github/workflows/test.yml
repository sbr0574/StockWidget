name: Test

on:
  workflow_dispatch:

jobs:
  update-codes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install pandas requests akshare

      - name: 测试代码
        run: python -u .github/scripts/akshare_test.py

