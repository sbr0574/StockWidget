name: Update Stock Codes

on:
  # schedule:
  #   - cron: "1 0 * * 1-5"
  workflow_dispatch:

concurrency:
  group: update-codes-data
  cancel-in-progress: false

jobs:
  update-codes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: python -m pip install openpyxl pandas pypinyin requests

      - name: 准备数据分支工作树
        env:
          DATA_BRANCH: codes-data
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/codes-data"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DATA_BRANCH"
            git worktree add --detach "$DATA_DIR" "origin/$DATA_BRANCH"
          else
            git worktree add --detach "$DATA_DIR"
            git -C "$DATA_DIR" switch --orphan "$DATA_BRANCH"
            git -C "$DATA_DIR" rm -rf --ignore-unmatch .
          fi
          mkdir -p "$DATA_DIR/resources"
          for file in \
            stock_sh.json stock_sz.json stock_bj.json fund_cn.json \
            stock_hk.json stock_us.json cache_us_cn_aliases.json \
            index_cn.json index_global.json \
            futures_sh.json codes_update_status.json; do
            if [[ ! -f "$DATA_DIR/resources/$file" ]]; then
              cp "resources/$file" "$DATA_DIR/resources/$file"
            fi
          done
          echo "DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

      - name: 拉取市场代码
        run: CODES_OUTPUT_DIR="$DATA_DIR/resources" python -u scripts/update_codes.py

      - name: 提交代码列表到数据分支
        env:
          DATA_BRANCH: codes-data
        run: |
          set -euo pipefail
          cd "$DATA_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            resources/stock_codes_list.json resources/futures_codes_list.json
          git add -- \
            resources/stock_sh.json \
            resources/stock_sz.json \
            resources/stock_bj.json \
            resources/fund_cn.json \
            resources/stock_hk.json \
            resources/stock_us.json \
            resources/cache_us_cn_aliases.json \
            resources/index_cn.json \
            resources/index_global.json \
            resources/futures_sh.json \
            resources/codes_update_status.json
          if git diff --cached --quiet; then
            echo "代码列表无变更，跳过提交"
          else
            git commit -m "chore: 更新市场代码列表"
            git push origin "HEAD:$DATA_BRANCH"
          fi
