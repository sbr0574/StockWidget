name: Update Stock Codes

# 每周日至周四 UTC 23:50 (北京时间周一至周五 07:50) 拉取全市场代码并提交到仓库 resources/ 下两个 JSON。
# 频率依据：股票/期货代码列表为低频变化（期货仅在新合约挂牌、到期退市、主力换月时变化，约每月），
# 周末不运行。程序运行时从本仓库 raw 地址下载这两个 JSON，无需在用户本地爬取。
on:
  schedule:
    - cron: "50 23 * * 0-4"
  workflow_dispatch:

jobs:
  update-codes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install pandas pypinyin requests PySide6-Essentials==6.11.1

      - name: 拉取市场代码
        run: python -u .github/scripts/update_codes.py

      - name: 生成 Qt 资源
        run: pyside6-rcc resources/resources.qrc -o resources/resources_rc.py

      - name: 提交代码列表
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/stock_codes_list.json resources/futures_codes_list.json resources/resources_rc.py
          if git diff --cached --quiet; then
            echo "代码列表无变更，跳过提交"
          else
            git commit -m "chore: 更新市场代码列表"
            git push
          fi
