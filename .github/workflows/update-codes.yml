name: Update Stock Codes

on:
  # schedule:
  #   - cron: "30 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: update-codes-data
  cancel-in-progress: false

jobs:
  update-codes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: 检出代码列表分支
        uses: actions/checkout@v7
        with:
          ref: codes-data

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: python -m pip install -r scripts/requirements.txt

      - name: 验证代码列表更新器
        run: python -m unittest discover -s tests -v

      - name: 拉取市场代码
        run: python -u scripts/update_codes.py

      - name: 提交代码列表到数据分支
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- resources/
          if git diff --cached --quiet; then
            echo "代码列表无变更，跳过提交"
          else
            git commit -m "chore: 更新市场代码列表"
            git push origin HEAD:refs/heads/codes-data
          fi
