name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm StockWidget.spec

      - name: Ad-hoc codesign (Apple Silicon)
        run: |
          codesign --force --deep -s - dist/StockWidget.app

      - name: Read application version
        id: version
        run: |
          version="$(python -c 'from stockwidget.constants import APP_VERSION; print(APP_VERSION)')"
          if [[ -z "$version" ]]; then
            echo "APP_VERSION is empty" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create release zip
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          staging="$RUNNER_TEMP/StockWidget-macOS-$RELEASE_VERSION"
          mkdir "$staging"

          cp README.md LICENSE NOTICE "$staging/"
          ditto dist/StockWidget.app "$staging/StockWidget.app"

          archive="$GITHUB_WORKSPACE/StockWidget-macOS-$RELEASE_VERSION.zip"
          ditto -c -k --norsrc "$staging" "$archive"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: StockWidget-macOS-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          archive: false
