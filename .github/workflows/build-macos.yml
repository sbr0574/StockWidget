name: Build macOS

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-macos.yml'
      - '.github/pyinstaller-hooks/**'
      - '.github/scripts/verify-build.py'
      - 'StockWidget.spec'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            python_arch: arm64
            arch: arm64
          - runner: macos-15-intel
            python_arch: x64
            arch: amd64
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Qt resources
        run: pyside6-rcc resources/resources.qrc -o resources/resources_rc.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm StockWidget.spec

      - name: Verify native build and deployment target
        run: python .github/scripts/verify-build.py --arch ${{ matrix.arch }} --macos-minimum "$MACOSX_DEPLOYMENT_TARGET"

      - name: Run macOS compatibility tests
        if: github.event_name == 'pull_request'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m unittest discover -s tests -t .

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep -s - dist/StockWidget.app

      - name: Create release zip
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          staging="$RUNNER_TEMP/StockWidget-macOS-$PACKAGE_ARCH"
          mkdir "$staging"

          cp README.md LICENSE NOTICE "$staging/"
          ditto dist/StockWidget.app "$staging/StockWidget.app"

          archive="$GITHUB_WORKSPACE/StockWidget-macOS-$PACKAGE_ARCH.zip"
          ditto -c -k --norsrc "$staging" "$archive"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: StockWidget-macOS-${{ matrix.arch }}.zip
          path: StockWidget-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          archive: false
